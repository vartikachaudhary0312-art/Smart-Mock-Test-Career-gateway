<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile | Smart Mock Test & Career Gateway</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body id="profilePageView">

  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="d-flex align-items-center gap-2">
          <div class="brand-logo"><i class="bi bi-mortarboard-fill"></i></div>
          <div class="brand-text">SMART MOCK TEST<span>CAREER GATEWAY</span></div>
        </div>
        <button class="sidebar-close-btn" type="button" aria-label="Close Navigation Menu"><i class="bi bi-x-lg"></i></button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">Main Navigation</div>
        <a href="student-dashboard.html" class="nav-link-custom"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="mock-test.html" class="nav-link-custom"><i class="bi bi-patch-question-fill"></i> Mock Tests</a>
        <a href="result.html" class="nav-link-custom"><i class="bi bi-bar-chart-line-fill"></i> Results & Analytics</a>
        <a href="resume.html" class="nav-link-custom"><i class="bi bi-file-earmark-person-fill"></i> Resume Analysis</a>
        
        <div class="nav-label">Career Hub</div>
        <a href="career.html" class="nav-link-custom"><i class="bi bi-briefcase-fill"></i> Career Gateway</a>
        <a href="applications.html" class="nav-link-custom"><i class="bi bi-send-check-fill"></i> Applications</a>
        
        <div class="nav-label">Account</div>
        <a href="profile.html" class="nav-link-custom active"><i class="bi bi-person-bounding-box"></i> Profile</a>
        <a href="settings.html" class="nav-link-custom"><i class="bi bi-gear-fill"></i> Settings</a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="nav-link-custom text-danger action-logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      
      <!-- Top Header Navbar -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-nav-toggle" id="btnSidebarToggle" type="button" aria-label="Toggle Navigation Menu" aria-expanded="false" title="Menu"><i class="bi bi-list"></i></button>
          <h1 class="page-title">Student Profile</h1>
        </div>

        <div class="header-right">
          <button type="button" class="theme-toggle-btn" title="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>
          <div class="user-avatar" id="headerUserAvatar">--</div>
        </div>
      </header>

      <!-- Page Body -->
      <div class="page-body">
        <div class="content-max-width">

          <div class="row g-4">
            <div class="col-lg-4">
              <div class="card-custom p-4 text-center">
                <div class="user-avatar mx-auto mb-3" id="profileBigAvatar" style="width: 80px; height: 80px; font-size: 2rem;">--</div>
                <h5 class="fw-bold text-dark mb-1" id="profileCardName">Student</h5>
                <span class="badge badge-purple mb-3" id="profileCardRole">Student Candidate</span>
                <p class="text-muted small mb-0" id="profileCardLocation"><i class="bi bi-geo-alt me-1"></i>India</p>
              </div>
            </div>

            <div class="col-lg-8">
              <div class="card-custom p-4">
                <h5 class="fw-bold text-dark mb-4">Edit Profile Information</h5>
                <form id="profileForm">
                  <div class="row g-3 mb-3">
                    <div class="col-md-6">
                      <label class="form-label-custom">Full Name</label>
                      <input type="text" class="form-control form-control-custom" id="profileNameInput" value="" placeholder="Enter your full name">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label-custom">Email Address</label>
                      <input type="email" class="form-control form-control-custom" id="profileEmailInput" value="" placeholder="name@college.edu" readonly>
                    </div>
                  </div>

                  <div class="row g-3 mb-3">
                    <div class="col-md-6">
                      <label class="form-label-custom">Mobile Phone</label>
                      <input type="text" class="form-control form-control-custom" id="profilePhoneInput" value="" placeholder="+91 9876543210">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label-custom">Location</label>
                      <input type="text" class="form-control form-control-custom" id="profileLocationInput" value="" placeholder="City, Country">
                    </div>
                  </div>

                  <div class="mb-4">
                    <label class="form-label-custom">Education & College Details</label>
                    <input type="text" class="form-control form-control-custom" id="profileEducationInput" value="" placeholder="Degree, Institution">
                  </div>

                  <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary-custom px-4">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>

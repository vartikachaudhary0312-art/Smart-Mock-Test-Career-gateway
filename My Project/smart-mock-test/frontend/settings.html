<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Smart Mock Test & Career Gateway</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body id="settingsPageView">

  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="d-flex align-items-center gap-2">
          <div class="brand-logo"><i class="bi bi-mortarboard-fill"></i></div>
          <div class="brand-text">SMART MOCK TEST<span>CAREER GATEWAY</span></div>
        </div>
        <button class="sidebar-close-btn" type="button" aria-label="Close Navigation Menu"><i class="bi bi-x-lg"></i></button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">Main Navigation</div>
        <a href="student-dashboard.html" class="nav-link-custom"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="mock-test.html" class="nav-link-custom"><i class="bi bi-patch-question-fill"></i> Mock Tests</a>
        <a href="result.html" class="nav-link-custom"><i class="bi bi-bar-chart-line-fill"></i> Results & Analytics</a>
        <a href="resume.html" class="nav-link-custom"><i class="bi bi-file-earmark-person-fill"></i> Resume Analysis</a>
        
        <div class="nav-label">Career Hub</div>
        <a href="career.html" class="nav-link-custom"><i class="bi bi-briefcase-fill"></i> Career Gateway</a>
        <a href="applications.html" class="nav-link-custom"><i class="bi bi-send-check-fill"></i> Applications</a>
        
        <div class="nav-label">Account</div>
        <a href="profile.html" class="nav-link-custom"><i class="bi bi-person-bounding-box"></i> Profile</a>
        <a href="settings.html" class="nav-link-custom active"><i class="bi bi-gear-fill"></i> Settings</a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="nav-link-custom text-danger action-logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      
      <!-- Top Header Navbar -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-nav-toggle" id="btnSidebarToggle" type="button" aria-label="Toggle Navigation Menu" aria-expanded="false" title="Menu"><i class="bi bi-list"></i></button>
          <h1 class="page-title">Application Settings</h1>
        </div>

        <div class="header-right">
          <button type="button" class="theme-toggle-btn" title="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>
          <div class="user-avatar" id="headerUserAvatar">RS</div>
        </div>
      </header>

      <!-- Page Body -->
      <div class="page-body">
        <div class="content-max-width">

          <div class="card-custom p-4 mb-4">
            <h5 class="fw-bold text-dark mb-3"><i class="bi bi-palette me-2 text-primary"></i>Visual Theme Preference</h5>
            
            <div class="d-flex gap-4">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="themeOption" id="themeLight" value="light" checked>
                <label class="form-check-label fw-semibold" for="themeLight">Light Theme</label>
              </div>

              <div class="form-check">
                <input class="form-check-input" type="radio" name="themeOption" id="themeDark" value="dark">
                <label class="form-check-label fw-semibold" for="themeDark">Dark Theme</label>
              </div>
            </div>
          </div>

          <div class="card-custom p-4 mb-4">
            <h5 class="fw-bold text-dark mb-3"><i class="bi bi-bell me-2 text-primary"></i>Notifications</h5>
            
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" id="notifEmail" checked>
              <label class="form-check-label small" for="notifEmail">Receive email alerts for new job postings matching your MCA skills</label>
            </div>

            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="notifResults" checked>
              <label class="form-check-label small" for="notifResults">Receive instant notifications upon mock test evaluation</label>
            </div>
          </div>

          <div class="d-flex justify-content-end">
            <button class="btn btn-primary-custom px-4" id="btnSaveSettings">Save Preferences</button>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Configuration | Admin Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body id="adminPortalView">

  <div class="app-container">
    
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-logo bg-danger text-white"><i class="bi bi-shield-lock-fill"></i></div>
        <div class="brand-text">ADMIN PORTAL<span class="text-danger">SYSTEM CONTROL</span></div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">Management Hub</div>
        <a href="dashboard.html" class="nav-link-custom"><i class="bi bi-speedometer2"></i> Dashboard Overview</a>
        <a href="students.html" class="nav-link-custom"><i class="bi bi-people-fill"></i> Students Directory</a>
        <a href="subjects.html" class="nav-link-custom"><i class="bi bi-journal-bookmark-fill"></i> Subjects & Modules</a>
        <a href="questions.html" class="nav-link-custom"><i class="bi bi-question-square-fill"></i> Question Bank</a>
        <a href="tests.html" class="nav-link-custom active"><i class="bi bi-sliders"></i> Test Settings</a>
        
        <div class="nav-label">Reports & Gateway</div>
        <a href="results.html" class="nav-link-custom"><i class="bi bi-clipboard-data-fill"></i> Test Audit Log</a>
        <a href="jobs.html" class="nav-link-custom"><i class="bi bi-briefcase-fill"></i> Job Postings</a>
        <a href="applications.html" class="nav-link-custom"><i class="bi bi-inboxes-fill"></i> Candidate Applications</a>
        <a href="reports.html" class="nav-link-custom"><i class="bi bi-file-earmark-bar-graph-fill"></i> System Reports</a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="nav-link-custom text-danger action-logout"><i class="bi bi-box-arrow-right"></i> Admin Logout</a>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-nav-toggle" type="button"><i class="bi bi-list"></i></button>
          <h1 class="page-title">Mock Test Configuration</h1>
        </div>
        <div class="header-right">
          <button type="button" class="theme-toggle-btn" title="Toggle Theme"><i class="bi bi-moon-stars-fill"></i></button>
          <div class="user-avatar bg-danger text-white border-danger">AD</div>
        </div>
      </header>

      <div class="page-body">
        <div class="content-max-width">

          <div class="card-custom p-4 mb-4">
            <h5 class="fw-bold text-dark mb-3"><i class="bi bi-sliders me-2 text-primary"></i>Default Assessment Rules</h5>
            
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label-custom">Default Duration (Minutes)</label>
                <input type="number" class="form-control form-control-custom" value="60">
              </div>

              <div class="col-md-4">
                <label class="form-label-custom">Questions Per Test</label>
                <input type="number" class="form-control form-control-custom" value="50">
              </div>

              <div class="col-md-4">
                <label class="form-label-custom">Pass Threshold (%)</label>
                <input type="number" class="form-control form-control-custom" value="60">
              </div>
            </div>

            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="checkCameraReq" checked>
              <label class="form-check-label fw-semibold" for="checkCameraReq">Require Mandatory Camera Permission Check</label>
            </div>

            <div class="form-check form-switch mb-4">
              <input class="form-check-input" type="checkbox" id="checkOtpReq" checked>
              <label class="form-check-label fw-semibold" for="checkOtpReq">Require 6-Digit OTP Verification Before Launch</label>
            </div>

            <div class="d-flex justify-content-end">
              <button class="btn btn-primary-custom px-4" onclick="App.showToast('Test configuration settings saved.', 'success')">Save Test Configuration</button>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/navigation.js"></script>
</body>
</html>
